name: Frontend CI

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

jobs:
  unit:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit tests (Vitest)
        run: pnpm run test:unit

  e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend code
        uses: actions/checkout@v4

      - name: Checkout backend code
        uses: actions/checkout@v4
        with:
          repository: 'ahahaharu/tutor-crm-backend'
          path: 'backend'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install backend dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Create backend env file
        working-directory: ./backend
        run: |
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=5433" >> .env
          echo "DB_USER=postgres" >> .env
          echo "DB_PASSWORD=postgres" >> .env
          echo "DB_NAME=tutor_crm" >> .env
          echo "JWT_SECRET=super-secret-test-key-for-ci" >> .env

      - name: Start backend Database
        working-directory: ./backend
        run: |
          docker compose up -d
          sleep 10

      - name: Run Drizzle migrations on backend
        working-directory: ./backend
        run: pnpm exec drizzle-kit push

      - name: Start backend server
        working-directory: ./backend
        run: |
          pnpm run start:dev > server.log 2>&1 &
          pnpm dlx wait-on tcp:3000

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright E2E tests
        run: pnpm run test:e2e
        env:
          API_URL: http://127.0.0.1:3000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Print backend logs on failure
        if: failure()
        working-directory: ./backend
        run: cat server.log
